name: Deploy to GitHub Pages

# Déploiement statique du tableau de bord (HTML + JS + JSON déjà commités).
# Aucune étape de build, aucun ETL : la mise à jour des données est manuelle
# (scripts Python lancés en local, puis commit des JSON de data_cache/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Opt-in Node.js 24 (les actions tournent sinon sur Node 20, déprécié à partir de juin 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
